<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub - 스네이크</title>
<link rel="stylesheet" href="../css/style.css">
<style>
#snakeCanvas {
  border: 1px solid rgba(0,255,136,0.3);
  box-shadow: 0 0 30px rgba(0,255,136,0.08);
  background: #050510;
}
</style>
</head>
<body class="game-page">

<div class="game-topbar">
  <div class="game-topbar-left">
    <a href="../dashboard.html" class="game-topbar-back">← 대시보드</a>
    <span class="game-topbar-title">SNAKE</span>
  </div>
  <div class="game-stats">
    <div class="game-stat">
      <div class="game-stat-label">SCORE</div>
      <div class="game-stat-val" id="statScore">0</div>
    </div>
    <div class="game-stat">
      <div class="game-stat-label">LENGTH</div>
      <div class="game-stat-val" id="statLen">3</div>
    </div>
    <div class="game-stat">
      <div class="game-stat-label">BEST</div>
      <div class="game-stat-val" id="statBest">0</div>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn btn-ghost btn-sm" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
  </div>
</div>

<div class="game-area">
  <canvas id="snakeCanvas" width="400" height="400"></canvas>

  <div class="tetris-sidebar">
    <div class="sidebar-box">
      <div class="sidebar-box-title">LEVEL</div>
      <div class="sidebar-val" id="sideLevel">1</div>
    </div>

    <div class="controls-legend">
      <div><span class="ctrl-key">W</span><span class="ctrl-key">↑</span> 위</div>
      <div><span class="ctrl-key">S</span><span class="ctrl-key">↓</span> 아래</div>
      <div><span class="ctrl-key">A</span><span class="ctrl-key">←</span> 왼쪽</div>
      <div><span class="ctrl-key">D</span><span class="ctrl-key">→</span> 오른쪽</div>
      <div><span class="ctrl-key">P</span> 일시정지</div>
    </div>

    <div class="sidebar-box" style="font-size:0.75rem;color:var(--muted);line-height:1.6;">
      <div class="sidebar-box-title">TIP</div>
      먹이를 먹을수록<br>
      빨라집니다!<br><br>
      벽과 자신의<br>
      몸을 피하세요.
    </div>
  </div>
</div>

<!-- Start Screen -->
<div class="modal-overlay" id="startModal">
  <div class="modal-box">
    <div class="modal-title">SNAKE</div>
    <div style="color:var(--muted);font-size:0.85rem;margin:16px 0;line-height:1.6;">
      화살표 또는 WASD로 이동<br>
      먹이를 먹어 점수를 올리세요!
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="startGame()">▸ 시작</button>
    </div>
  </div>
</div>

<!-- Game Over Modal -->
<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">GAME OVER</div>
    <div class="modal-score" id="modalScore">0</div>
    <div class="modal-score-label">SCORE</div>
    <div id="newRecordMsg" style="color:var(--green);font-size:0.85rem;margin-bottom:8px;display:none;">
      🏆 신기록 달성!
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="restartGame()">▸ 다시하기</button>
      <a href="../dashboard.html" class="btn btn-ghost">대시보드</a>
    </div>
  </div>
</div>

<script src="../data/db.js"></script>
<script src="../js/app.js"></script>
<script>
const GRID = 20;  // grid count
const CELL = 20;  // px per cell
const canvas = document.getElementById('snakeCanvas');
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, food, specialFood;
let score, gameRunning, paused, gameLoop;
let specialTimer, specialActive;

const FOOD_SCORE = 10;
const SPECIAL_SCORE = 50;

function initGame() {
  snake = [
    { x: 10, y: 10 },
    { x: 9,  y: 10 },
    { x: 8,  y: 10 }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  paused = false;
  specialFood = null;
  specialActive = false;
  placeFood();
  updateStats();
}

function startGame() {
  document.getElementById('startModal').style.display = 'none';
  initGame();
  gameRunning = true;
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, getSpeed());
  draw();
}

function restartGame() {
  document.getElementById('modal').style.display = 'none';
  startGame();
}

function getSpeed() {
  const len = snake.length;
  return Math.max(80, 200 - Math.floor(len / 3) * 10);
}

function placeFood() {
  const empty = [];
  for (let x = 0; x < GRID; x++)
    for (let y = 0; y < GRID; y++)
      if (!snake.find(s => s.x === x && s.y === y))
        empty.push({ x, y });
  food = empty[Math.floor(Math.random() * empty.length)];
}

function placeSpecialFood() {
  if (specialActive) return;
  const empty = [];
  for (let x = 0; x < GRID; x++)
    for (let y = 0; y < GRID; y++)
      if (!snake.find(s => s.x === x && s.y === y) && !(food.x === x && food.y === y))
        empty.push({ x, y });
  if (empty.length === 0) return;
  specialFood = empty[Math.floor(Math.random() * empty.length)];
  specialActive = true;
  clearTimeout(specialTimer);
  specialTimer = setTimeout(() => { specialFood = null; specialActive = false; }, 8000);
}

function tick() {
  if (!gameRunning || paused) return;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    endGame(); return;
  }
  // Self collision
  if (snake.find(s => s.x === head.x && s.y === head.y)) {
    endGame(); return;
  }

  snake.unshift(head);

  let grew = false;
  if (head.x === food.x && head.y === food.y) {
    score += FOOD_SCORE;
    grew = true;
    placeFood();
    // Chance to spawn special food every 5 regular foods
    if (Math.random() < 0.3) placeSpecialFood();
    // Speed up
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, getSpeed());
  } else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
    score += SPECIAL_SCORE;
    grew = true;
    specialFood = null;
    specialActive = false;
    clearTimeout(specialTimer);
  }

  if (!grew) snake.pop();
  updateStats();
  draw();
}

function updateStats() {
  document.getElementById('statScore').textContent = formatScore(score);
  document.getElementById('statLen').textContent = snake ? snake.length : 3;
  document.getElementById('sideLevel').textContent = Math.floor((snake ? snake.length : 3) / 5) + 1;
}

/* ── Drawing ── */
function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let x = 0; x < GRID; x++)
    for (let y = 0; y < GRID; y++)
      ctx.fillRect(x * CELL + CELL/2 - 1, y * CELL + CELL/2 - 1, 2, 2);

  // Snake
  snake.forEach((seg, i) => {
    const t = 1 - i / snake.length;
    if (i === 0) {
      ctx.fillStyle = '#88ff44';
    } else {
      const g = Math.floor(100 + t * 155);
      ctx.fillStyle = `rgb(0, ${g}, ${Math.floor(t * 60)})`;
    }
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);

    // Head eyes
    if (i === 0) {
      ctx.fillStyle = '#050510';
      const ex = dir.y !== 0 ? [4, 12] : [dir.x === 1 ? 14 : 4, dir.x === 1 ? 14 : 4];
      const ey = dir.x !== 0 ? [5, 13] : [dir.y === 1 ? 14 : 5, dir.y === 1 ? 14 : 5];
      ctx.fillRect(seg.x * CELL + ex[0], seg.y * CELL + ey[0], 3, 3);
      ctx.fillRect(seg.x * CELL + ex[1], seg.y * CELL + ey[1], 3, 3);
    }
  });

  // Food (pulsing)
  const pulse = 0.7 + Math.sin(Date.now() / 200) * 0.3;
  ctx.fillStyle = `rgba(255, 68, 100, ${pulse})`;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffaaaa';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2 - 2, food.y * CELL + CELL/2 - 2, 3, 0, Math.PI * 2);
  ctx.fill();

  // Special food ⭐
  if (specialFood) {
    const sp = 0.6 + Math.sin(Date.now() / 120) * 0.4;
    ctx.fillStyle = `rgba(255, 215, 0, ${sp})`;
    ctx.font = `${CELL - 2}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', specialFood.x * CELL + CELL/2, specialFood.y * CELL + CELL/2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // Pause overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
  }
}

// Redraw food pulse animation
function animLoop() {
  if (gameRunning && !paused) draw();
  requestAnimationFrame(animLoop);
}

function endGame() {
  gameRunning = false;
  clearInterval(gameLoop);

  const session = Auth.getSession();
  if (session) {
    GameDB.addScore(session.username, 'snake', score);
    const best = GameDB.getUserBest(session.username, 'snake');
    document.getElementById('statBest').textContent = formatScore(best);
    if (score >= best) {
      document.getElementById('newRecordMsg').style.display = 'block';
    } else {
      document.getElementById('newRecordMsg').style.display = 'none';
    }
  }
  document.getElementById('modalScore').textContent = formatScore(score);
  document.getElementById('modal').style.display = 'flex';
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▸ 재개' : '⏸ 일시정지';
}

/* ── Controls ── */
document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; e.preventDefault(); break;
    case 'ArrowDown':  case 's': case 'S': if (dir.y !== -1) nextDir = { x: 0, y: 1 };  e.preventDefault(); break;
    case 'ArrowLeft':  case 'a': case 'A': if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': if (dir.x !== -1) nextDir = { x: 1, y: 0 };  e.preventDefault(); break;
    case 'p': case 'P': togglePause(); break;
  }
});

/* ── Init ── */
async function start() {
  await GameDB.init();
  const session = Auth.requireAuth();
  if (!session) return;
  const best = GameDB.getUserBest(session.username, 'snake');
  document.getElementById('statBest').textContent = formatScore(best);
  animLoop();
}
start();
</script>
</body>
</html>

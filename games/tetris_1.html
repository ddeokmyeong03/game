<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS</title>
<style>
/* === CSS Variables === */
:root {
  --bg: #0d0d1a;
  --card: #1a1a2e;
  --card2: #16213e;
  --border: rgba(0, 255, 255, 0.2);
  --border-hover: rgba(0, 255, 255, 0.6);
  --cyan: #00ffff;
  --magenta: #ff00ff;
  --green: #00ff88;
  --yellow: #ffd700;
  --red: #ff4466;
  --text: #e0e0ff;
  --muted: #7777aa;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Courier New', Courier, monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* === Scrollbar === */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(0,255,255,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

/* === Buttons === */
.btn {
  padding: 9px 22px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85rem;
  letter-spacing: 1px;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--cyan);
  color: #050510;
  font-weight: bold;
}
.btn-primary:hover {
  background: #33ffff;
  box-shadow: 0 0 20px rgba(0,255,255,0.4);
}

.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-hover); }

.btn-sm { padding: 5px 12px; font-size: 0.75rem; }

/* === Game Page Layout === */
.game-page {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.game-topbar {
  background: rgba(22, 33, 62, 0.97);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.game-topbar-left { display: flex; align-items: center; gap: 16px; }

.game-topbar-title {
  font-size: 1.1rem;
  color: var(--cyan);
  letter-spacing: 3px;
  text-shadow: 0 0 10px rgba(0,255,255,0.4);
}

.game-topbar-back {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.8rem;
  padding: 4px 10px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  transition: all 0.2s;
}
.game-topbar-back:hover { color: var(--cyan); border-color: var(--border-hover); }

.game-stats {
  display: flex;
  gap: 20px;
}

.game-stat { text-align: center; min-width: 60px; }
.game-stat-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; }
.game-stat-val {
  font-size: 1.2rem;
  font-weight: bold;
  color: var(--yellow);
  text-shadow: 0 0 8px rgba(255,215,0,0.4);
}

.game-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.game-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 16px;
  gap: 20px;
}

/* === Game Canvas === */
canvas {
  display: block;
  image-rendering: pixelated;
}

/* === Modal === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
}

.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px 40px;
  text-align: center;
  max-width: 360px;
  width: 90%;
  box-shadow: 0 0 60px rgba(0,255,255,0.1);
}

.modal-title {
  font-size: 1.5rem;
  color: var(--cyan);
  letter-spacing: 3px;
  margin-bottom: 8px;
  text-shadow: 0 0 15px var(--cyan);
}

.modal-score {
  font-size: 2.5rem;
  color: var(--yellow);
  font-weight: bold;
  margin: 16px 0;
  text-shadow: 0 0 15px rgba(255,215,0,0.5);
}

.modal-score-label {
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 24px;
}

.modal-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

/* === Tetris Sidebar === */
.tetris-sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 140px;
}

.sidebar-box {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}

.sidebar-box-title {
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.sidebar-val {
  font-size: 1.4rem;
  color: var(--yellow);
  font-weight: bold;
}

/* === Controls legend === */
.controls-legend {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.8;
}

.ctrl-key {
  display: inline-block;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  padding: 1px 6px;
  color: var(--text);
  font-size: 0.72rem;
  margin-right: 4px;
}

/* === Canvas styles === */
#mainCanvas {
  border: 1px solid rgba(0,255,255,0.3);
  box-shadow: 0 0 30px rgba(0,255,255,0.1);
  background: #050510;
}
#nextCanvas {
  border: 1px solid var(--border);
  background: #050510;
  display: block;
}

/* === Responsive === */
@media (max-width: 640px) {
  .game-stats { gap: 10px; }
  .game-stat-val { font-size: 1rem; }
}
</style>
</head>
<body class="game-page">

<!-- Top bar -->
<div class="game-topbar">
  <div class="game-topbar-left">
    <a href="../dashboard.html" class="game-topbar-back">← 대시보드</a>
    <span class="game-topbar-title">TETRIS</span>
  </div>
  <div class="game-stats">
    <div class="game-stat">
      <div class="game-stat-label">SCORE</div>
      <div class="game-stat-val" id="statScore">0</div>
    </div>
    <div class="game-stat">
      <div class="game-stat-label">LEVEL</div>
      <div class="game-stat-val" id="statLevel">1</div>
    </div>
    <div class="game-stat">
      <div class="game-stat-label">LINES</div>
      <div class="game-stat-val" id="statLines">0</div>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn btn-ghost btn-sm" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
  </div>
</div>

<!-- Game Area -->
<div class="game-area">

  <!-- Main canvas -->
  <canvas id="mainCanvas" width="300" height="600"></canvas>

  <!-- Sidebar -->
  <div class="tetris-sidebar">

    <div class="sidebar-box">
      <div class="sidebar-box-title">NEXT</div>
      <canvas id="nextCanvas" width="100" height="100"></canvas>
    </div>

    <div class="sidebar-box">
      <div class="sidebar-box-title">BEST</div>
      <div class="sidebar-val" id="bestScore">0</div>
    </div>

    <div class="sidebar-box">
      <div class="sidebar-box-title">HIGH LINE</div>
      <div class="sidebar-val" id="bestLines">0</div>
    </div>

    <div class="controls-legend">
      <div><span class="ctrl-key">←→</span> 이동</div>
      <div><span class="ctrl-key">↑</span> 회전</div>
      <div><span class="ctrl-key">↓</span> 소프트 드롭</div>
      <div><span class="ctrl-key">SPACE</span> 하드 드롭</div>
      <div><span class="ctrl-key">P</span> 일시정지</div>
    </div>
  </div>
</div>

<!-- Game Over Modal -->
<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">GAME OVER</div>
    <div class="modal-score" id="modalScore">0</div>
    <div class="modal-score-label">SCORE</div>
    <div id="newRecordMsg" style="color:#00ff88;font-size:0.85rem;margin-bottom:8px;display:none;">
      🏆 신기록 달성!
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="restartGame()">▸ 다시하기</button>
      <a href="../dashboard.html" class="btn btn-ghost">대시보드</a>
    </div>
  </div>
</div>

<script>
/* ============================================================
   TETRIS ENGINE  (standalone — 인증 없이 독립 실행)
   ============================================================ */

const COLS = 10, ROWS = 20, CELL = 30;
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nctx = nextCanvas.getContext('2d');

const PIECES = [
  { shape: [[1,1,1,1]],            color: '#00ffff' }, // I
  { shape: [[1,1],[1,1]],          color: '#ffd700' }, // O
  { shape: [[0,1,0],[1,1,1]],      color: '#cc00ff' }, // T
  { shape: [[0,1,1],[1,1,0]],      color: '#00ff88' }, // S
  { shape: [[1,1,0],[0,1,1]],      color: '#ff4466' }, // Z
  { shape: [[1,0,0],[1,1,1]],      color: '#ff8800' }, // J
  { shape: [[0,0,1],[1,1,1]],      color: '#4488ff' }, // L
];

let board, cur, curX, curY, nextPiece;
let score, level, lines, gameOver, paused;
let dropTimer, dropInterval;

/* ---- 점수 포맷 ---- */
function formatScore(n) {
  return Number(n).toLocaleString();
}

/* ---- localStorage 베스트 기록 ---- */
const STORAGE_BEST_SCORE = 'tetris1_bestScore';
const STORAGE_BEST_LINES = 'tetris1_bestLines';

function getBestScore() { return parseInt(localStorage.getItem(STORAGE_BEST_SCORE) || '0', 10); }
function getBestLines()  { return parseInt(localStorage.getItem(STORAGE_BEST_LINES) || '0', 10); }

function saveBestScore(s) {
  if (s > getBestScore()) { localStorage.setItem(STORAGE_BEST_SCORE, s); return true; }
  return false;
}
function saveBestLines(l) {
  if (l > getBestLines()) { localStorage.setItem(STORAGE_BEST_LINES, l); }
}

/* ---- 초기화 ---- */
function init() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  score = 0; level = 1; lines = 0;
  gameOver = false; paused = false;
  nextPiece = randomPiece();
  spawn();
  updateStats();
  clearInterval(dropTimer);
  dropInterval = 800;
  dropTimer = setInterval(tick, dropInterval);
  document.getElementById('modal').style.display = 'none';
  document.getElementById('pauseBtn').textContent = '⏸ 일시정지';
}

function randomPiece() {
  return JSON.parse(JSON.stringify(PIECES[Math.floor(Math.random() * PIECES.length)]));
}

function spawn() {
  cur = nextPiece;
  nextPiece = randomPiece();
  curX = Math.floor(COLS / 2) - Math.floor(cur.shape[0].length / 2);
  curY = 0;
  drawNext();
  if (!valid(curX, curY, cur.shape)) {
    gameOver = true;
    clearInterval(dropTimer);
    showModal();
  }
}

function valid(x, y, shape) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++)
      if (shape[r][c]) {
        const nx = x + c, ny = y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
        if (ny >= 0 && board[ny][nx]) return false;
      }
  return true;
}

function rotate(shape) {
  return shape[0].map((_, i) => shape.map(row => row[i]).reverse());
}

function lock() {
  for (let r = 0; r < cur.shape.length; r++)
    for (let c = 0; c < cur.shape[r].length; c++)
      if (cur.shape[r][c]) board[curY + r][curX + c] = cur.color;
  clearLines();
  spawn();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(c => c)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++; r++;
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts;
    lines += cleared;
    const newLevel = Math.floor(lines / 10) + 1;
    if (newLevel !== level) {
      level = newLevel;
      clearInterval(dropTimer);
      dropInterval = Math.max(80, 800 - (level - 1) * 70);
      dropTimer = setInterval(tick, dropInterval);
    }
  }
  updateStats();
}

function tick() {
  if (paused || gameOver) return;
  if (valid(curX, curY + 1, cur.shape)) {
    curY++;
  } else {
    lock();
  }
  draw();
}

function ghostY() {
  let gy = curY;
  while (valid(curX, gy + 1, cur.shape)) gy++;
  return gy;
}

function updateStats() {
  document.getElementById('statScore').textContent = formatScore(score);
  document.getElementById('statLevel').textContent = level;
  document.getElementById('statLines').textContent = lines;
}

/* ============================================================
   DRAWING
   ============================================================ */
function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
    }
  }

  // Board
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) drawCell(ctx, c, r, board[r][c]);

  // Ghost
  const gy = ghostY();
  if (gy !== curY) {
    for (let r = 0; r < cur.shape.length; r++)
      for (let c = 0; c < cur.shape[r].length; c++)
        if (cur.shape[r][c]) {
          ctx.globalAlpha = 0.2;
          drawCell(ctx, curX + c, gy + r, cur.color);
          ctx.globalAlpha = 1;
        }
  }

  // Current piece
  for (let r = 0; r < cur.shape.length; r++)
    for (let c = 0; c < cur.shape[r].length; c++)
      if (cur.shape[r][c]) drawCell(ctx, curX + c, curY + r, cur.color);

  // Pause overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    ctx.font = '14px Courier New';
    ctx.fillStyle = '#7777aa';
    ctx.fillText('P 를 눌러 재개', canvas.width / 2, canvas.height / 2 + 36);
    ctx.textAlign = 'left';
  }
}

function drawCell(c, x, y, color) {
  const px = x * CELL, py = y * CELL;
  c.fillStyle = color;
  c.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
  // Highlight
  c.fillStyle = 'rgba(255,255,255,0.25)';
  c.fillRect(px + 1, py + 1, CELL - 2, 4);
  c.fillRect(px + 1, py + 1, 4, CELL - 2);
}

function drawNext() {
  nctx.fillStyle = '#050510';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  const s = nextPiece.shape;
  const nc = 20; // cell size for next preview
  const ox = Math.floor((nextCanvas.width - s[0].length * nc) / 2);
  const oy = Math.floor((nextCanvas.height - s.length * nc) / 2);
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c]) {
        nctx.fillStyle = nextPiece.color;
        nctx.fillRect(ox + c * nc + 1, oy + r * nc + 1, nc - 2, nc - 2);
        nctx.fillStyle = 'rgba(255,255,255,0.25)';
        nctx.fillRect(ox + c * nc + 1, oy + r * nc + 1, nc - 2, 3);
      }
}

/* ============================================================
   CONTROLS
   ============================================================ */
document.addEventListener('keydown', e => {
  if (gameOver) return;
  switch (e.key) {
    case 'ArrowLeft':  e.preventDefault(); if (!paused && valid(curX - 1, curY, cur.shape)) { curX--; draw(); } break;
    case 'ArrowRight': e.preventDefault(); if (!paused && valid(curX + 1, curY, cur.shape)) { curX++; draw(); } break;
    case 'ArrowDown':  e.preventDefault(); if (!paused) { if (valid(curX, curY + 1, cur.shape)) { curY++; score++; } else lock(); draw(); } break;
    case 'ArrowUp':    e.preventDefault();
      if (!paused) {
        const rot = rotate(cur.shape);
        if (valid(curX, curY, rot)) { cur.shape = rot; draw(); }
        else if (valid(curX + 1, curY, rot)) { cur.shape = rot; curX++; draw(); }
        else if (valid(curX - 1, curY, rot)) { cur.shape = rot; curX--; draw(); }
      }
      break;
    case ' ':
      e.preventDefault();
      if (!paused) {
        const gy = ghostY(); score += (gy - curY) * 2; curY = gy; lock(); draw();
      }
      break;
    case 'p': case 'P': togglePause(); break;
  }
});

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▸ 재개' : '⏸ 일시정지';
  draw();
}

function restartGame() {
  init();
  draw();
}

/* ============================================================
   GAME OVER / SAVE SCORE
   ============================================================ */
function showModal() {
  const isNewRecord = saveBestScore(score);
  saveBestLines(lines);

  // 사이드바 베스트 업데이트
  document.getElementById('bestScore').textContent = formatScore(getBestScore());
  document.getElementById('bestLines').textContent = getBestLines();

  document.getElementById('newRecordMsg').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('modalScore').textContent = formatScore(score);
  document.getElementById('modal').style.display = 'flex';
  draw();
}

/* ============================================================
   START
   ============================================================ */
function start() {
  document.getElementById('bestScore').textContent = formatScore(getBestScore());
  document.getElementById('bestLines').textContent = getBestLines();
  init();
  draw();
}

start();
</script>
</body>
</html>

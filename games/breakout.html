<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub - 스와이프 벽돌깨기</title>
<link rel="stylesheet" href="../css/style.css">
<style>
#boCanvas {
  border: 1px solid rgba(255,136,0,0.3);
  box-shadow: 0 0 30px rgba(255,136,0,0.08);
  background: #050510;
  display: block;
  cursor: crosshair;
  max-width: 100%;
}
</style>
</head>
<body class="game-page">

<div class="game-topbar">
  <div class="game-topbar-left">
    <a href="../dashboard.html" class="game-topbar-back">← 대시보드</a>
    <span class="game-topbar-title">BRICK BREAKER</span>
  </div>
  <div class="game-stats">
    <div class="game-stat">
      <div class="game-stat-label">SCORE</div>
      <div class="game-stat-val" id="statScore">0</div>
    </div>
    <div class="game-stat">
      <div class="game-stat-label">TURN</div>
      <div class="game-stat-val" id="statTurn">1</div>
    </div>
    <div class="game-stat">
      <div class="game-stat-label">BALLS</div>
      <div class="game-stat-val" id="statBalls">1</div>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn btn-ghost btn-sm" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
    <button class="btn btn-ghost btn-sm" onclick="restartGame()">↺ 재시작</button>
  </div>
</div>

<div class="game-area">
  <canvas id="boCanvas" width="360" height="580"></canvas>

  <div class="tetris-sidebar">
    <div class="sidebar-box">
      <div class="sidebar-box-title">BEST</div>
      <div class="sidebar-val" id="bestScore">0</div>
    </div>
    <div class="controls-legend">
      <div><span class="ctrl-key">마우스</span> 조준</div>
      <div><span class="ctrl-key">클릭</span> 발사</div>
      <div><span class="ctrl-key">P</span> 일시정지</div>
    </div>
    <div class="sidebar-box" style="font-size:0.73rem;color:var(--muted);line-height:2;">
      <div class="sidebar-box-title">안내</div>
      <div>● = 공 추가 아이템</div>
      <div style="color:#4488ff">■ 파랑: 약함</div>
      <div style="color:#00cc88">■ 초록</div>
      <div style="color:#ffd700">■ 노랑</div>
      <div style="color:#ff8800">■ 주황</div>
      <div style="color:#ff4466">■ 빨강: 강함</div>
    </div>
  </div>
</div>

<!-- Game Over Modal -->
<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">GAME OVER</div>
    <div class="modal-score" id="modalScore">0</div>
    <div class="modal-score-label">SCORE &nbsp;|&nbsp; BEST: <span id="modalBest">0</span></div>
    <div id="newRecordMsg" style="color:var(--green);font-size:0.85rem;margin-bottom:8px;display:none;">🏆 신기록!</div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="restartGame()">↺ 다시하기</button>
      <a href="../dashboard.html" class="btn btn-ghost">대시보드</a>
    </div>
  </div>
</div>

<script src="../data/db.js"></script>
<script src="../js/app.js"></script>
<script>
const canvas = document.getElementById('boCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width;   // 360
const H = canvas.height;  // 580

// ── Grid config ──────────────────────────────────
const COLS     = 7;
const BRICK_W  = 46;
const BRICK_H  = 24;
const GAP      = 4;
const OFFSET_X = (W - COLS * (BRICK_W + GAP) + GAP) / 2;
const OFFSET_Y = 20;
// game over: brick bottom reaches FLOOR_Y (ball floor line)

// ── Ball config ──────────────────────────────────
const BALL_R    = 7;
const BALL_SPD  = 11;
const FLOOR_Y   = H - 48;
const BALL_DELAY = 5;   // frames between successive ball launches

// ── Game state ───────────────────────────────────
let phase;        // 'aim' | 'shooting' | 'dropping'
let bricks;       // [{col, row, hp, maxHp}]
let items;        // [{col, row}]  — +ball pickup items
let balls;        // [{x, y, dx, dy, active, done}]
let ballCount, launchX, aimAngle;
let score, turn, paused, gameActive;
let launchQueue, launchTimer, firstLandX, addBallsNext, dropDelay;
let raf;

// ── Color by HP ratio ────────────────────────────
function hpColor(hp, maxHp) {
  const r = hp / maxHp;
  if (r > 0.75) return '#4488ff';
  if (r > 0.50) return '#00cc88';
  if (r > 0.30) return '#ffd700';
  if (r > 0.12) return '#ff8800';
  return '#ff4466';
}

// ── Grid helpers ─────────────────────────────────
function brickRect(col, row) {
  return {
    x: OFFSET_X + col * (BRICK_W + GAP),
    y: OFFSET_Y + row * (BRICK_H + GAP),
    w: BRICK_W, h: BRICK_H
  };
}

// ── Spawn a new top row ───────────────────────────
function brickCountRange() {
  if (turn <= 40) return [1, Math.min(5, 1 + Math.floor(turn / 9))]; // 1→1~5 점진
  if (turn <= 80) return [3, 7];
  return [5, 7];
}

function spawnRow() {
  const hp = turn; // HP = 턴 번호 (1턴=1, 2턴=2, ...)

  // shuffle column indices
  const cols = Array.from({ length: COLS }, (_, i) => i);
  for (let i = cols.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }

  const [minB, maxB] = brickCountRange();
  const brickCount = minB + Math.floor(Math.random() * (maxB - minB + 1));
  for (let i = 0; i < brickCount; i++) {
    bricks.push({ col: cols[i], row: 0, hp, maxHp: hp });
  }
  // ~55% chance of a +ball item in a remaining slot
  if (Math.random() < 0.55 && cols[brickCount] !== undefined) {
    items.push({ col: cols[brickCount], row: 0 });
  }
}

// ── Drop all bricks one row ───────────────────────
function dropBricks() {
  bricks.forEach(b  => b.row++);
  items.forEach(it  => it.row++);
  // 아이템이 공 바닥선에 닿으면 제거
  items = items.filter(it => brickRect(it.col, it.row).y + BRICK_H < FLOOR_Y);
}

function checkGameOver() {
  // 벽돌 바닥이 FLOOR_Y(공이 멈추는 선)에 닿으면 게임오버
  return bricks.some(b => {
    const r = brickRect(b.col, b.row);
    return r.y + r.h >= FLOOR_Y;
  });
}

// ── Circle-Rect collision ────────────────────────
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}

// ── Init ─────────────────────────────────────────
function initGame() {
  bricks = []; items = []; balls = [];
  ballCount   = 1;
  launchX     = W / 2;
  aimAngle    = 0;          // straight up
  score       = 0;
  turn        = 1;
  paused      = false;
  gameActive  = true;
  firstLandX  = null;
  addBallsNext = 0;
  phase       = 'aim';
  cancelAnimationFrame(raf);
  spawnRow();
  updateStats();
  raf = requestAnimationFrame(loop);
}

function restartGame() {
  document.getElementById('modal').style.display = 'none';
  initGame();
}

// ── Main loop ────────────────────────────────────
function loop() {
  if (!gameActive) return;
  if (!paused) {
    if (phase === 'shooting') updateShooting();
    if (phase === 'dropping') updateDropping();
  }
  draw();
  raf = requestAnimationFrame(loop);
}

// ── Shooting update ───────────────────────────────
function updateShooting() {
  // launch next ball
  if (launchQueue > 0) {
    launchTimer--;
    if (launchTimer <= 0) {
      const idx = ballCount - launchQueue;
      const b   = balls[idx];
      b.dx = Math.sin(aimAngle) * BALL_SPD;
      b.dy = -Math.cos(aimAngle) * BALL_SPD;
      b.active = true;
      launchQueue--;
      launchTimer = BALL_DELAY;
    }
  }

  // move each active ball
  for (const b of balls) {
    if (!b.active || b.done) continue;

    b.x += b.dx;
    b.y += b.dy;

    // wall / ceiling bounces
    if (b.x - BALL_R < 0)  { b.x = BALL_R;     b.dx =  Math.abs(b.dx); }
    if (b.x + BALL_R > W)  { b.x = W - BALL_R; b.dx = -Math.abs(b.dx); }
    if (b.y - BALL_R < 0)  { b.y = BALL_R;      b.dy =  Math.abs(b.dy); }

    // floor — ball stops here
    if (b.y + BALL_R >= FLOOR_Y) {
      b.y    = FLOOR_Y - BALL_R;
      b.done = true;
      if (firstLandX === null) firstLandX = b.x;
      continue;
    }

    // brick collision
    for (let i = bricks.length - 1; i >= 0; i--) {
      const br = bricks[i];
      const r  = brickRect(br.col, br.row);
      if (!circleRect(b.x, b.y, BALL_R, r.x, r.y, r.w, r.h)) continue;

      // reflect off nearest axis
      const overlapL = b.x - r.x;
      const overlapR = r.x + r.w - b.x;
      const overlapT = b.y - r.y;
      const overlapB = r.y + r.h - b.y;
      const minH = Math.min(overlapL, overlapR);
      const minV = Math.min(overlapT, overlapB);
      if (minH < minV) {
        b.dx *= -1;
        b.x  += (overlapL < overlapR) ? -(BALL_R - overlapL + 1) : (BALL_R - overlapR + 1);
      } else {
        b.dy *= -1;
        b.y  += (overlapT < overlapB) ? -(BALL_R - overlapT + 1) : (BALL_R - overlapB + 1);
      }

      br.hp--;
      score++;
      if (br.hp <= 0) { bricks.splice(i, 1); score += 5; }
      updateStats();
      break; // one brick per frame per ball
    }

    // item pickup
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const r  = brickRect(it.col, it.row);
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      if (Math.hypot(b.x - cx, b.y - cy) < BALL_R + r.w * 0.38) {
        items.splice(i, 1);
        addBallsNext++;
      }
    }
  }

  // transition when all balls done
  if (launchQueue === 0 && balls.every(b => b.done)) {
    ballCount  += addBallsNext;
    if (firstLandX !== null) {
      launchX = Math.max(BALL_R + 4, Math.min(W - BALL_R - 4, firstLandX));
    }
    phase     = 'dropping';
    dropDelay = 20;
    updateStats();
  }
}

// ── Dropping update ───────────────────────────────
function updateDropping() {
  dropDelay--;
  if (dropDelay > 0) return;
  dropBricks();
  if (checkGameOver()) { endGame(); return; }
  turn++;
  spawnRow();
  balls = [];
  phase = 'aim';
  updateStats();
}

// ── Aim guide trajectory ──────────────────────────
function drawAimGuide() {
  if (phase !== 'aim') return;
  let x = launchX, y = FLOOR_Y - BALL_R;
  let dx = Math.sin(aimAngle);
  let dy = -Math.cos(aimAngle);
  const step = 14;
  const steps = 40;

  for (let i = 0; i < steps; i++) {
    x += dx * step;
    y += dy * step;
    if (x - BALL_R < 0)  { x = BALL_R;     dx =  Math.abs(dx); }
    if (x + BALL_R > W)  { x = W - BALL_R; dx = -Math.abs(dx); }
    if (y - BALL_R < 0)  { y = BALL_R;      dy =  Math.abs(dy); }
    if (y >= FLOOR_Y) break;

    ctx.globalAlpha = (1 - i / steps) * 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, i === 0 ? 3.5 : 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── Draw ─────────────────────────────────────────
function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // 바닥 = 공 멈추는 선 = 게임오버 선 (빨간 점선)
  ctx.strokeStyle = 'rgba(255,60,60,0.35)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y); ctx.lineTo(W, FLOOR_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // bricks
  for (const br of bricks) {
    const r   = brickRect(br.col, br.row);
    const col = hpColor(br.hp, br.maxHp);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(r.x + 3, r.y + 2, r.w - 6, 4);

    const fs = br.hp >= 100 ? 8 : br.hp >= 10 ? 10 : 12;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${fs}px "Courier New"`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(br.hp, r.x + r.w / 2, r.y + r.h / 2);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  // items
  for (const it of items) {
    const r  = brickRect(it.col, it.row);
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const rad = r.w * 0.36;
    ctx.strokeStyle = '#aaffcc';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#aaffcc';
    ctx.font = 'bold 13px "Courier New"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', cx, cy + 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // aim guide
  drawAimGuide();

  // balls
  for (const b of balls) {
    if (!b.active) continue;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(160,230,255,0.6)';
    ctx.beginPath();
    ctx.arc(b.x - 2, b.y - 2, BALL_R * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  // launch position marker
  if (phase === 'aim' || phase === 'dropping') {
    // triangle arrow
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.moveTo(launchX, FLOOR_Y - BALL_R - 3);
    ctx.lineTo(launchX - 7, FLOOR_Y + 7);
    ctx.lineTo(launchX + 7, FLOOR_Y + 7);
    ctx.closePath();
    ctx.fill();
    // ball count badge
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.beginPath();
    ctx.arc(launchX, FLOOR_Y + 22, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px "Courier New"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ballCount, launchX, FLOOR_Y + 23);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // paused overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff8800';
    ctx.font = 'bold 30px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '13px "Courier New"';
    ctx.fillText('P 키 또는 버튼으로 재개', W / 2, H / 2 + 28);
    ctx.textAlign = 'left';
  }
}

// ── Aim from pointer ──────────────────────────────
function setAimFromPointer(px, py) {
  if (phase !== 'aim') return;
  const dy = py - FLOOR_Y;
  if (dy >= -10) return; // must be above floor
  let angle = Math.atan2(px - launchX, -dy);
  const MAX_A = Math.PI * 80 / 180;
  aimAngle = Math.max(-MAX_A, Math.min(MAX_A, angle));
}

// ── Stats ────────────────────────────────────────
function updateStats() {
  document.getElementById('statScore').textContent = formatScore(score);
  document.getElementById('statTurn').textContent  = turn;
  document.getElementById('statBalls').textContent = ballCount;
}

// ── Fire ─────────────────────────────────────────
function fire(py) {
  if (!gameActive || paused || phase !== 'aim') return;
  if (py >= FLOOR_Y - 10) return; // must click above floor
  phase        = 'shooting';
  launchQueue  = ballCount;
  launchTimer  = 0;
  firstLandX   = null;
  addBallsNext = 0;
  balls        = Array.from({ length: ballCount }, () => ({
    x: launchX, y: FLOOR_Y - BALL_R,
    dx: 0, dy: 0, active: false, done: false
  }));
}

// ── End game ─────────────────────────────────────
function endGame() {
  gameActive = false;
  cancelAnimationFrame(raf);
  const session = Auth.getSession();
  if (session) {
    GameDB.addScore(session.username, 'breakout', score);
    const best = GameDB.getUserBest(session.username, 'breakout');
    document.getElementById('bestScore').textContent = formatScore(best);
    document.getElementById('modalBest').textContent = formatScore(best);
    document.getElementById('newRecordMsg').style.display =
      (score > 0 && score >= best) ? 'block' : 'none';
  }
  document.getElementById('modalScore').textContent = formatScore(score);
  document.getElementById('modal').style.display = 'flex';
}

function togglePause() {
  if (!gameActive) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▸ 재개' : '⏸ 일시정지';
}

// ── Mouse / Touch input ───────────────────────────
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  setAimFromPointer(
    (e.clientX - rect.left) * (W / rect.width),
    (e.clientY - rect.top)  * (H / rect.height)
  );
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  fire((e.clientY - rect.top) * (H / rect.height));
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  setAimFromPointer(
    (t.clientX - rect.left) * (W / rect.width),
    (t.clientY - rect.top)  * (H / rect.height)
  );
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0], rect = canvas.getBoundingClientRect();
  fire((t.clientY - rect.top) * (H / rect.height));
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') togglePause();
});

// ── Init ─────────────────────────────────────────
async function start() {
  await GameDB.init();
  const session = Auth.requireAuth();
  if (!session) return;
  document.getElementById('bestScore').textContent =
    formatScore(GameDB.getUserBest(session.username, 'breakout'));
  initGame();
}
start();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub - 순위</title>
<link rel="stylesheet" href="css/style.css">
<style>
.lb-page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}
.overall-table {
  margin-bottom: 16px;
}
.medal { font-size: 1rem; }
.empty-row td {
  text-align: center;
  color: var(--muted);
  padding: 24px 0;
  font-size: 0.85rem;
}
.tab-game-icon { margin-right: 6px; }
</style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div class="lb-page-header">
    <div class="page-header" style="margin-bottom:0">
      <div class="page-title">순위표</div>
      <div class="page-subtitle">게임별 최고 기록 TOP 10</div>
    </div>
    <a href="dashboard.html" class="btn btn-ghost btn-sm">← 대시보드</a>
  </div>

  <!-- Game tabs -->
  <div class="lb-tabs" id="lbTabs"></div>

  <!-- Table area -->
  <div class="card">
    <table class="lb-table" id="lbTable">
      <thead>
        <tr>
          <th>순위</th>
          <th>플레이어</th>
          <th>최고 점수</th>
          <th>나의 순위</th>
        </tr>
      </thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>

  <!-- All-time summary per user -->
  <div class="section" style="margin-top:32px;">
    <div class="section-header">
      <span class="section-title">▸ 종합 순위 (게임별 최고 점수 합산)</span>
    </div>
    <div class="card">
      <table class="lb-table overall-table">
        <thead>
          <tr>
            <th>순위</th>
            <th>플레이어</th>
            <th>테트리스</th>
            <th>스네이크</th>
            <th>브레이크아웃</th>
            <th>메모리</th>
            <th>합계</th>
          </tr>
        </thead>
        <tbody id="overallBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const GAMES = [
  { id: 'tetris',   name: '테트리스',    icon: '🟦' },
  { id: 'snake',    name: '스네이크',    icon: '🐍' },
  { id: 'breakout', name: '브레이크아웃', icon: '🧱' },
  { id: 'memory',   name: '메모리 매치', icon: '🃏' }
];

let currentGame = 'tetris';
let myUsername = '';

async function init() {
  await GameDB.init();
  const session = Auth.requireAuth();
  if (!session) return;
  myUsername = session.username;

  buildNavbar('leaderboard');

  // Build tabs
  const tabs = document.getElementById('lbTabs');
  GAMES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'lb-tab' + (g.id === currentGame ? ' active' : '');
    btn.innerHTML = `<span class="tab-game-icon">${g.icon}</span>${g.name}`;
    btn.onclick = () => switchGame(g.id);
    tabs.appendChild(btn);
  });

  renderGame(currentGame);
  renderOverall();
}

function switchGame(id) {
  currentGame = id;
  document.querySelectorAll('.lb-tab').forEach((btn, i) => {
    btn.classList.toggle('active', GAMES[i].id === id);
  });
  renderGame(id);
}

function renderGame(id) {
  const top = GameDB.getTopScores(id, 10);
  const body = document.getElementById('lbBody');
  const medals = ['🥇', '🥈', '🥉'];

  if (top.length === 0) {
    body.innerHTML = '<tr class="empty-row"><td colspan="4">아직 기록이 없습니다. 첫 번째 플레이어가 되세요!</td></tr>';
    return;
  }

  const myRank = top.findIndex(s => s.username === myUsername);

  body.innerHTML = top.map((s, i) => {
    const isMe = s.username === myUsername;
    const rankClass = i < 3 ? `rank-${i+1}` : 'rank-other';
    return `
      <tr style="${isMe ? 'background:rgba(0,255,255,0.05);' : ''}">
        <td><span class="rank ${rankClass}">${i < 3 ? medals[i] : (i + 1)}</span></td>
        <td>
          ${isMe ? '<span style="color:var(--cyan)">▶ </span>' : ''}
          ${s.username}
          ${isMe ? ' <span style="font-size:0.7rem;color:var(--muted)">(나)</span>' : ''}
        </td>
        <td><span class="score-val">${formatScore(s.score)}</span></td>
        <td>${isMe ? '<span style="color:var(--green)">✓ ' + (i + 1) + '위</span>' : '-'}</td>
      </tr>
    `;
  }).join('');

  // If I'm not in top 10 but have a score
  if (myRank === -1) {
    const myBest = GameDB.getUserBest(myUsername, id);
    if (myBest > 0) {
      body.innerHTML += `
        <tr style="border-top:1px dashed var(--border)">
          <td colspan="4" style="text-align:center;font-size:0.78rem;color:var(--muted);padding:10px 0;">
            나의 최고 점수: <span style="color:var(--yellow)">${formatScore(myBest)}</span> (TOP 10 외)
          </td>
        </tr>
      `;
    }
  }
}

function renderOverall() {
  const users = GameDB.getUsers();
  const gameIds = GAMES.map(g => g.id);
  const rows = users.map(u => {
    const scores = gameIds.map(id => GameDB.getUserBest(u.username, id));
    const total = scores.reduce((a, b) => a + b, 0);
    return { username: u.username, scores, total };
  }).filter(r => r.total > 0).sort((a, b) => b.total - a.total);

  const medals = ['🥇', '🥈', '🥉'];
  const body = document.getElementById('overallBody');

  if (rows.length === 0) {
    body.innerHTML = '<tr class="empty-row"><td colspan="7">아직 기록이 없습니다.</td></tr>';
    return;
  }

  body.innerHTML = rows.slice(0, 15).map((r, i) => {
    const isMe = r.username === myUsername;
    const rankClass = i < 3 ? `rank-${i+1}` : 'rank-other';
    return `
      <tr style="${isMe ? 'background:rgba(0,255,255,0.05);' : ''}">
        <td><span class="rank ${rankClass}">${i < 3 ? medals[i] : (i + 1)}</span></td>
        <td>${isMe ? '<span style="color:var(--cyan)">▶ </span>' : ''}${r.username}</td>
        ${r.scores.map(s => `<td><span style="color:var(--muted)">${s ? formatScore(s) : '-'}</span></td>`).join('')}
        <td><span class="score-val">${formatScore(r.total)}</span></td>
      </tr>
    `;
  }).join('');
}

init();
</script>
</body>
</html>

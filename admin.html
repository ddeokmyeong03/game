<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub - 관리자</title>
<link rel="stylesheet" href="css/style.css">
<style>
.user-table { width: 100%; border-collapse: collapse; }
.user-table th { text-align: left; padding: 8px 14px; color: var(--muted); font-size: 0.72rem; letter-spacing: 2px; border-bottom: 1px solid var(--border); }
.user-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.88rem; vertical-align: middle; }
.user-table tr:hover td { background: rgba(255,68,102,0.03); }
.role-admin { color: var(--red); font-size: 0.75rem; }
.role-user  { color: var(--muted); font-size: 0.75rem; }

.panel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.pending-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.pending-row:last-child { border-bottom: none; }

@media (max-width: 768px) { .panel-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div class="page-header">
    <div class="page-title" style="color:var(--red);">관리자 패널</div>
    <div class="page-subtitle">유저 승인 및 관리</div>
  </div>

  <div id="alertArea"></div>

  <!-- 승인 대기 -->
  <div class="card" id="pendingCard" style="margin-bottom:20px;border-color:rgba(255,215,0,0.35);background:rgba(255,215,0,0.03);">
    <div class="section-header">
      <span class="section-title" style="color:var(--yellow);">▸ 승인 대기 중인 계정</span>
      <span id="pendingCount" style="font-size:0.8rem;color:var(--yellow);"></span>
    </div>
    <div id="pendingList"></div>
  </div>

  <div class="panel-grid">
    <!-- User list -->
    <div class="card" style="grid-column: 1/-1;">
      <div class="section-header">
        <span class="section-title">▸ 전체 유저 목록</span>
        <span id="userCount" style="font-size:0.8rem;color:var(--muted);"></span>
      </div>
      <table class="user-table">
        <thead>
          <tr>
            <th>#</th>
            <th>아이디 / 본명</th>
            <th>역할 / 상태</th>
            <th>최고 점수 합계</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>
    </div>

    <!-- Add user -->
    <div class="card">
      <div class="section-header">
        <span class="section-title">▸ 유저 직접 추가 (즉시 승인)</span>
      </div>
      <div id="addAlert"></div>
      <form onsubmit="addUser(event)">
        <div class="form-group">
          <label class="form-label">본명</label>
          <input type="text" id="addFullname" class="form-input" placeholder="홍길동" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input type="text" id="addUsername" class="form-input" placeholder="4~16자 영문/숫자/_" minlength="4" maxlength="16" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="text" id="addPassword" class="form-input" placeholder="비밀번호" minlength="4" required>
        </div>
        <div class="form-group">
          <label class="form-label">역할</label>
          <select id="addRole" class="form-input">
            <option value="user">일반 유저</option>
            <option value="admin">관리자</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">+ 추가</button>
      </form>
    </div>

    <!-- Maintenance -->
    <div class="card">
      <div class="section-header">
        <span class="section-title">▸ 유지보수</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-ghost" onclick="GameDB.exportFullDB()">
          💾 백업 다운로드 (db.js)
        </button>
        <button class="btn btn-danger" onclick="confirmClearScores()">
          🗑 전체 점수 초기화
        </button>
      </div>
      <p style="margin-top:14px;font-size:0.74rem;color:var(--muted);line-height:1.7;">
        백업 파일을 <code>data/db.js</code>로 교체하면 새 환경에서도 계정·점수가 복원됩니다.<br>
        점수 초기화는 되돌릴 수 없습니다. 계정 정보는 유지됩니다.
      </p>
    </div>
  </div>
</div>

<script src="data/db.js"></script>
<script src="js/app.js"></script>
<script>
const GAME_IDS = ['tetris', 'snake', 'breakout', 'memory', 'dino', '1010'];

async function init() {
  await GameDB.init();
  const session = Auth.requireAuth();
  if (!session) return;
  if (!Auth.isAdmin()) {
    window.location.href = 'dashboard.html';
    return;
  }
  buildNavbar('admin');
  renderPending();
  renderUsers();
}

// ── 승인 대기 ─────────────────────────────────────────
function renderPending() {
  const pending = GameDB.getPendingUsers();
  const card    = document.getElementById('pendingCard');
  const list    = document.getElementById('pendingList');

  if (pending.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  document.getElementById('pendingCount').textContent = `${pending.length}명 대기 중`;

  list.innerHTML = pending.map(u => `
    <div class="pending-row">
      <div style="flex:1;">
        <span style="color:var(--text);font-weight:bold;">${u.username}</span>
        ${u.fullname ? `<span style="color:var(--muted);font-size:0.8rem;margin-left:8px;">(${u.fullname})</span>` : ''}
        <div style="font-size:0.72rem;color:var(--muted);margin-top:2px;">
          ${u.created ? new Date(u.created).toLocaleString('ko-KR') : ''}
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="approveUser('${u.username}')">✓ 승인</button>
      <button class="btn btn-danger btn-sm"  onclick="rejectUser('${u.username}')">✗ 거절</button>
    </div>
  `).join('');
}

function approveUser(username) {
  GameDB.approveUser(username);
  renderPending();
  renderUsers();
  showAlert(document.getElementById('alertArea'), `"${username}" 승인 완료`, 'success');
}

function rejectUser(username) {
  const u = GameDB.getUser(username);
  const name = u && u.fullname ? `${u.fullname} (${username})` : username;
  if (!confirm(`"${name}" 의 가입을 거절하고 삭제합니까?`)) return;
  GameDB.removeUser(username);
  renderPending();
  renderUsers();
  showAlert(document.getElementById('alertArea'), `"${username}" 거절 및 삭제됨`, 'info');
}

// ── 유저 목록 ─────────────────────────────────────────
function renderUsers() {
  const users = GameDB.getUsers();
  document.getElementById('userCount').textContent = `총 ${users.length}명`;

  const body = document.getElementById('userBody');
  const me   = Auth.getSession().username;

  body.innerHTML = users.map((u, i) => {
    const total   = GAME_IDS.reduce((s, g) => s + GameDB.getUserBest(u.username, g), 0);
    const isPend  = u.approved === false;
    const isMe    = u.username === me;
    return `
      <tr>
        <td style="color:var(--muted)">${i + 1}</td>
        <td>
          <div style="font-weight:500;">${u.username}${isMe ? ' <span style="color:var(--cyan);font-size:0.7rem">(나)</span>' : ''}</div>
          ${u.fullname ? `<div style="font-size:0.75rem;color:var(--muted);margin-top:2px;">${u.fullname}</div>` : ''}
        </td>
        <td>
          <span class="role-${u.role}">${u.role === 'admin' ? '🔑 관리자' : '👤 유저'}</span>
          ${isPend ? '<div style="color:var(--yellow);font-size:0.7rem;margin-top:2px;">⏳ 대기</div>' : ''}
        </td>
        <td style="color:var(--yellow)">${total ? formatScore(total) : '–'}</td>
        <td>
          ${!isMe
            ? `<button class="btn btn-danger btn-sm" onclick="removeUser('${u.username}')">삭제</button>`
            : '<span style="color:var(--muted);font-size:0.75rem">–</span>'
          }
        </td>
      </tr>
    `;
  }).join('');
}

function addUser(e) {
  e.preventDefault();
  const fn = document.getElementById('addFullname').value.trim();
  const u  = document.getElementById('addUsername').value.trim();
  const p  = document.getElementById('addPassword').value;
  const r  = document.getElementById('addRole').value;
  const area = document.getElementById('addAlert');

  if (!/^[a-zA-Z0-9_]{4,16}$/.test(u)) {
    showAlert(area, '아이디는 영문/숫자/_ 4~16자'); return;
  }

  const users = GameDB.getUsers();
  if (users.find(usr => usr.username === u)) {
    showAlert(area, '이미 존재하는 아이디'); return;
  }

  GameDB._setUsers([...users, { username: u, password: p, fullname: fn, role: r, approved: true }]);
  showAlert(area, `"${u}" 추가 완료!`, 'success');
  e.target.reset();
  renderUsers();
}

function removeUser(username) {
  const u    = GameDB.getUser(username);
  const name = u && u.fullname ? `${u.fullname} (${username})` : username;
  if (!confirm(`"${name}" 을 삭제하시겠습니까?\n이 유저의 점수는 남아 있습니다.`)) return;
  GameDB.removeUser(username);
  renderPending();
  renderUsers();
  showAlert(document.getElementById('alertArea'), `"${username}" 삭제됨`, 'success');
}

function confirmClearScores() {
  if (confirm('⚠️ 모든 게임 점수를 초기화합니다.\n이 작업은 되돌릴 수 없습니다.\n계속하시겠습니까?')) {
    localStorage.removeItem('gp_scores');
    showAlert(document.getElementById('alertArea'), '점수가 초기화되었습니다.', 'success');
    renderUsers();
  }
}

init();
</script>
</body>
</html>

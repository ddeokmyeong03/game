<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub - 로그인</title>
<link rel="stylesheet" href="css/style.css">
<style>
.login-footer {
  margin-top: 20px;
  text-align: center;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-box">

    <div class="login-logo">
      <div class="login-logo-title">GAME<span style="color:var(--magenta);text-shadow:0 0 20px var(--magenta)">HUB</span></div>
      <div class="login-logo-sub">▸ ARCADE GAME PORTAL ◂</div>
    </div>

    <div id="alertArea"></div>

    <!-- Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('login')">로그인</button>
      <button class="tab-btn" onclick="switchTab('register')">회원가입</button>
    </div>

    <!-- Login -->
    <div id="tab-login" class="tab-panel active">
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input type="text" id="loginUser" class="form-input" placeholder="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" id="loginPass" class="form-input" placeholder="••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">
          ▸ 로그인
        </button>
      </form>
    </div>

    <!-- Register -->
    <div id="tab-register" class="tab-panel">
      <form id="registerForm" onsubmit="doRegister(event)">
        <div class="form-group">
          <label class="form-label">본명</label>
          <input type="text" id="regFullname" class="form-input" placeholder="홍길동 (순위에 표시됩니다)" maxlength="20" required>
        </div>
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input type="text" id="regUser" class="form-input" placeholder="영문/숫자/_ (4~16자)" minlength="4" maxlength="16" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" id="regPass" class="form-input" placeholder="비밀번호 (4자 이상)" minlength="4" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 확인</label>
          <input type="password" id="regPass2" class="form-input" placeholder="비밀번호 재입력" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">
          ▸ 가입 신청
        </button>
      </form>
      <p style="font-size:0.74rem;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;">
        가입 후 관리자 승인이 필요합니다.
      </p>
    </div>

    <div class="login-footer">
      &copy; 2026 GameHub &nbsp;|&nbsp; Tetris · Snake · Breakout · Memory · Dino · 1010!
    </div>
  </div>
</div>

<script src="data/db.js"></script>
<script src="js/app.js"></script>
<script>
  GameDB.init().then(() => {
    if (Auth.getSession()) window.location.href = 'dashboard.html';
  });

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', ['login','register'][i] === name);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('alertArea').innerHTML = '';
  }

  function doLogin(e) {
    e.preventDefault();
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const result = Auth.login(u, p);
    if (result === true) {
      window.location.href = 'dashboard.html';
    } else if (result === 'pending') {
      showAlert(document.getElementById('alertArea'), '가입 승인 대기 중입니다. 관리자에게 문의하세요.', 'info');
    } else {
      showAlert(document.getElementById('alertArea'), '아이디 또는 비밀번호가 틀렸습니다.');
    }
  }

  function doRegister(e) {
    e.preventDefault();
    const fn = document.getElementById('regFullname').value.trim();
    const u  = document.getElementById('regUser').value.trim();
    const p  = document.getElementById('regPass').value;
    const p2 = document.getElementById('regPass2').value;
    const area = document.getElementById('alertArea');
    if (!fn) { showAlert(area, '본명을 입력해주세요.'); return; }
    if (p !== p2) { showAlert(area, '비밀번호가 일치하지 않습니다.'); return; }
    if (!/^[a-zA-Z0-9_]{4,16}$/.test(u)) {
      showAlert(area, '아이디는 영문/숫자/_ 4~16자여야 합니다.'); return;
    }
    if (GameDB.addUser(u, p, fn)) {
      showAlert(area, `"${fn}" 님의 가입 신청이 완료되었습니다. 관리자 승인 후 로그인하세요.`, 'success');
      document.getElementById('registerForm').reset();
    } else {
      showAlert(area, '이미 존재하는 아이디입니다.');
    }
  }
</script>
</body>
</html>
